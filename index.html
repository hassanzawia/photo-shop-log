<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --paper:#F6F7F5;
  --paper-2:#EDEFEC;
  --ink:#14181C;
  --ink-soft:#4A5259;
  --line:#CDD2D5;
  --cyan:#0092BC;
  --magenta:#D6006F;
  --yellow:#F2B705;
  --black-ink:#14181C;
  --card:#FFFFFF;
  --shadow: 0 1px 2px rgba(20,24,28,.06), 0 6px 20px rgba(20,24,28,.05);
  --radius: 10px;
}
*{box-sizing:border-box;}
.kmroot{
  direction: rtl;
  font-family:'IBM Plex Sans Arabic','Noto Kufi Arabic',sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100%;
  padding: 0 0 40px 0;
  -webkit-font-smoothing: antialiased;
}
.mono{ font-family:'IBM Plex Mono',monospace; direction: ltr; unicode-bidi: embed; }

/* ---------- Registration strip (signature element) ---------- */
.regstrip{
  display:flex; align-items:center; gap:0;
  height: 10px;
  width:100%;
}
.regstrip span{ flex:1; height:100%; }
.regstrip .c{background:var(--cyan);}
.regstrip .m{background:var(--magenta);}
.regstrip .y{background:var(--yellow);}
.regstrip .k{background:var(--ink);}

.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding: 18px 28px 14px 28px;
  border-bottom: 1px solid var(--line);
  background: var(--paper);
  flex-wrap: wrap; gap: 14px;
}
.brand{ display:flex; align-items:center; gap:12px; }
.brand-mark{
  width:38px;height:38px;border-radius:8px;
  background: var(--ink); position:relative; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
.brand-mark::before{
  content:"✛"; color:#fff; font-size:18px; font-weight:700;
}
.brand h1{
  font-family:'Noto Kufi Arabic',sans-serif; font-weight:800;
  font-size: 19px; margin:0; letter-spacing:.2px;
}
.brand .sub{
  font-family:'IBM Plex Mono',monospace; direction:ltr; unicode-bidi: embed;
  font-size: 11px; color: var(--ink-soft); letter-spacing:.5px; margin-top:2px;
}

.tabs{ display:flex; gap:6px; background:var(--paper-2); padding:4px; border-radius: 999px; }
.tab-btn{
  border:none; background:transparent; cursor:pointer;
  font-family:'IBM Plex Sans Arabic',sans-serif; font-weight:600; font-size:14px;
  padding: 9px 20px; border-radius:999px; color: var(--ink-soft);
  transition: all .15s ease;
}
.tab-btn.active{ background: var(--ink); color:#fff; }

.wrap{ max-width: 1180px; margin: 0 auto; padding: 26px 28px; }

/* ---------- Entry view ---------- */
.entry-grid{
  display:grid; grid-template-columns: 1.4fr 1fr; gap: 22px;
}
@media (max-width: 900px){ .entry-grid{ grid-template-columns: 1fr; } }

.card{
  background: var(--card); border:1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 22px;
}
.card h2{
  font-family:'Noto Kufi Arabic',sans-serif; font-size:16px; font-weight:700;
  margin: 0 0 16px 0; display:flex; align-items:center; gap:8px;
}
.card h2 .dot{ width:8px;height:8px;border-radius:50%; background: var(--magenta); }

.field-row{ display:flex; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
.field{ flex:1; min-width: 140px; }
.field label{
  display:block; font-size:12px; color: var(--ink-soft); margin-bottom:6px; font-weight:600;
}
.field input[type=date], .field input[type=text], .field select{
  width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:7px;
  font-family:'IBM Plex Sans Arabic',sans-serif; font-size:14px; background:#fff; color:var(--ink);
}
.field input[type=date]:focus, .field input[type=text]:focus, .field select:focus{
  outline: 2px solid var(--cyan); outline-offset:1px; border-color: var(--cyan);
}

.shift-toggle{ display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.shift-toggle button{
  flex:1; border:none; background:#fff; padding:9px 10px; cursor:pointer;
  font-family:'IBM Plex Sans Arabic',sans-serif; font-weight:600; font-size:13px; color:var(--ink-soft);
}
.shift-toggle button.active.morning{ background: var(--yellow); color:var(--ink); }
.shift-toggle button.active.evening{ background: var(--ink); color:#fff; }

.svc-row{
  display:flex; align-items:center; gap:10px; padding:10px 0;
  border-bottom: 1px dashed var(--line);
}
.svc-row:last-of-type{ border-bottom:none; }
.svc-name{ flex:1; }
.svc-name .t{ font-size:13.5px; font-weight:600; }
.svc-name .u{ font-size:11px; color:var(--ink-soft); }
.stepper{ display:flex; align-items:center; gap:0; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
.stepper button{
  width:30px; height:30px; border:none; background: var(--paper-2); cursor:pointer;
  font-size:16px; color:var(--ink); line-height:1;
}
.stepper button:hover{ background:#e2e5e2; }
.stepper input{
  width:52px; text-align:center; border:none; font-family:'IBM Plex Mono',monospace;
  font-size:14px; padding:6px 2px;
}
.svc-sub{ width:78px; text-align:left; font-size:13px; color: var(--ink-soft); }

.expenses-row{ display:flex; align-items:center; gap:12px; margin-top:14px; }
.expenses-row label{ font-size:13px; font-weight:600; flex-shrink:0; }
.expenses-row input{
  flex:1; padding:9px 11px; border:1px solid var(--line); border-radius:7px;
  font-family:'IBM Plex Mono',monospace; direction:ltr;
}

.submit-btn{
  width:100%; margin-top:18px; padding:13px; border:none; border-radius:8px;
  background: var(--magenta); color:#fff; font-weight:700; font-size:15px; cursor:pointer;
  font-family:'IBM Plex Sans Arabic',sans-serif;
  transition: transform .08s ease, background .15s ease;
}
.submit-btn:hover{ background:#B7005F; }
.submit-btn:active{ transform: scale(.99); }

/* ---------- Receipt preview ---------- */
.receipt-wrap{ position:sticky; top: 20px; }
.receipt{
  background:#fff; border:1px solid var(--line); border-radius: 4px;
  box-shadow: var(--shadow); padding: 20px 18px 26px 18px;
  position:relative; overflow:hidden;
}
.receipt::before{
  content:""; position:absolute; top:0; left:0; right:0; height:6px;
  background: repeating-linear-gradient(90deg, var(--paper) 0 8px, transparent 8px 16px);
}
.receipt-head{ text-align:center; border-bottom:1px dashed var(--line); padding-bottom:12px; margin-bottom:12px; }
.receipt-head .rk{ font-family:'Noto Kufi Arabic',sans-serif; font-weight:800; font-size:15px; }
.receipt-head .rm{ font-family:'IBM Plex Mono',monospace; direction:ltr; font-size:11px; color:var(--ink-soft); margin-top:4px;}
.rline{ display:flex; justify-content:space-between; font-size:13px; padding:4px 0; }
.rline .rl-name{ color: var(--ink-soft); }
.rline .rl-val{ font-family:'IBM Plex Mono',monospace; direction:ltr; }
.rtotal{
  display:flex; justify-content:space-between; align-items:baseline;
  border-top:2px solid var(--ink); margin-top:10px; padding-top:10px;
}
.rtotal .rt-label{ font-weight:700; font-size:14px; }
.rtotal .rt-val{ font-family:'IBM Plex Mono',monospace; direction:ltr; font-size:22px; font-weight:600; color: var(--magenta); }
.rnet{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); margin-top:6px; }
.rnet .rv{ font-family:'IBM Plex Mono',monospace; direction:ltr; }

.print-flash{
  position:absolute; inset:0; background: var(--ink); opacity:0; pointer-events:none;
  animation: none;
}
.print-flash.go{ animation: flash .5s ease; }
@keyframes flash{ 0%{opacity:.08;} 100%{opacity:0;} }

.toast{
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--ink); color:#fff; padding: 12px 22px; border-radius:8px;
  font-size:13px; font-weight:600; opacity:0; transition: all .25s ease; pointer-events:none;
  display:flex; align-items:center; gap:8px;
}
.toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }
.toast .sw{ width:8px;height:8px;border-radius:50%; background: var(--yellow); }

/* ---------- Dashboard ---------- */
.kpi-grid{ display:grid; grid-template-columns: repeat(4,1fr); gap:16px; margin-bottom:22px; }
@media (max-width: 900px){ .kpi-grid{ grid-template-columns: repeat(2,1fr); } }
.kpi{
  background:#fff; border:1px solid var(--line); border-radius: var(--radius);
  padding: 16px 16px 16px 18px; box-shadow: var(--shadow); position:relative; overflow:hidden;
}
.kpi::before{ content:""; position:absolute; top:0; right:0; bottom:0; width:5px; }
.kpi.rev::before{ background: var(--magenta); }
.kpi.net::before{ background: var(--cyan); }
.kpi.cnt::before{ background: var(--yellow); }
.kpi.avg::before{ background: var(--ink); }
.kpi .kl{ font-size:12px; color:var(--ink-soft); font-weight:600; margin-bottom:8px; }
.kpi .kv{ font-family:'IBM Plex Mono',monospace; direction:ltr; font-size:24px; font-weight:600; }

.chart-grid{ display:grid; grid-template-columns: 1.5fr 1fr; gap:18px; margin-bottom:22px; }
@media (max-width: 900px){ .chart-grid{ grid-template-columns: 1fr; } }
.chart-card canvas{ max-height: 260px; }

.filter-row{ display:flex; gap:10px; align-items:end; margin-bottom:18px; flex-wrap:wrap; }

table.log-table{ width:100%; border-collapse:collapse; font-size:13px; }
table.log-table th{
  text-align:right; background: var(--paper-2); padding:9px 10px; font-weight:700;
  border-bottom: 2px solid var(--line); font-size:12px;
}
table.log-table td{ padding:9px 10px; border-bottom:1px solid var(--line); }
table.log-table td.num{ font-family:'IBM Plex Mono',monospace; direction:ltr; text-align:left; }
table.log-table tr:hover{ background: var(--paper); }

.settings-toggle{
  display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:700; font-size:14px;
  color: var(--ink); margin-bottom: 4px;
}
.settings-body{ display:none; margin-top:14px; }
.settings-body.open{ display:block; }
.price-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap:12px; }
.price-item label{ font-size:12px; color:var(--ink-soft); display:block; margin-bottom:5px; font-weight:600;}
.price-item input{
  width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px;
  font-family:'IBM Plex Mono',monospace; direction:ltr;
}
.save-prices-btn{
  margin-top:14px; padding:9px 20px; border:none; border-radius:7px; background: var(--ink);
  color:#fff; font-weight:600; cursor:pointer; font-family:'IBM Plex Sans Arabic',sans-serif;
}
.empty-state{ text-align:center; padding: 40px 20px; color: var(--ink-soft); }
.empty-state .es-mark{ font-size:30px; margin-bottom:10px; }
</style>

<div class="kmroot" id="app">
  <div class="regstrip"><span class="c"></span><span class="m"></span><span class="y"></span><span class="k"></span></div>

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <h1>سجل التصوير اليومي</h1>
        <div class="sub">bizhub 446e · bizhub 428 COLOUR</div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="tab-entry" onclick="switchTab('entry')">إدخال اليوم</button>
      <button class="tab-btn" id="tab-dash" onclick="switchTab('dash')">المراقبة</button>
    </div>
  </div>

  <div class="wrap">

    <!-- ============ ENTRY VIEW ============ -->
    <div id="view-entry">
      <div class="entry-grid">
        <div class="card">
          <h2><span class="dot"></span>بيانات العملية</h2>

          <div class="field-row">
            <div class="field">
              <label>التاريخ</label>
              <input type="date" id="f-date">
            </div>
            <div class="field">
              <label>الفترة</label>
              <div class="shift-toggle">
                <button type="button" id="btn-morning" class="active morning" onclick="setShift('صباح')">☀ صباح</button>
                <button type="button" id="btn-evening" class="evening" onclick="setShift('مساء')">● مساء</button>
              </div>
            </div>
            <div class="field">
              <label>اسم الموظف (اختياري)</label>
              <input type="text" id="f-employee" placeholder="مثال: أحمد">
            </div>
          </div>

          <div id="svc-rows"></div>

          <div class="expenses-row">
            <label>المصروفات (د.ل)</label>
            <input type="text" inputmode="decimal" id="f-expenses" value="0">
          </div>

          <button class="submit-btn" onclick="saveEntry()">حفظ وطباعة الإيصال</button>
        </div>

        <div class="receipt-wrap">
          <div class="receipt">
            <div class="print-flash" id="print-flash"></div>
            <div class="receipt-head">
              <div class="rk">إيصال العملية</div>
              <div class="rm" id="r-date">--</div>
            </div>
            <div id="r-lines"></div>
            <div class="rtotal">
              <span class="rt-label">الإجمالي</span>
              <span class="rt-val mono" id="r-total">0.000</span>
            </div>
            <div class="rnet">
              <span>صافي بعد المصروفات</span>
              <span class="rv" id="r-net">0.000</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ DASHBOARD VIEW ============ -->
    <div id="view-dash" style="display:none;">

      <div class="kpi-grid">
        <div class="kpi rev"><div class="kl">إجمالي الإيراد</div><div class="kv" id="k-rev">0.000</div></div>
        <div class="kpi net"><div class="kl">صافي الإيراد</div><div class="kv" id="k-net">0.000</div></div>
        <div class="kpi cnt"><div class="kl">عدد العمليات</div><div class="kv" id="k-cnt">0</div></div>
        <div class="kpi avg"><div class="kl">متوسط العملية</div><div class="kv" id="k-avg">0.000</div></div>
      </div>

      <div class="filter-row">
        <div class="field" style="max-width:180px;"><label>من تاريخ</label><input type="date" id="filt-from"></div>
        <div class="field" style="max-width:180px;"><label>إلى تاريخ</label><input type="date" id="filt-to"></div>
        <button class="submit-btn" style="width:auto; margin-top:0; padding:9px 18px;" onclick="renderDashboard()">تطبيق</button>
      </div>

      <div class="chart-grid">
        <div class="card chart-card">
          <h2><span class="dot"></span>الإيراد اليومي</h2>
          <canvas id="chart-line"></canvas>
        </div>
        <div class="card chart-card">
          <h2><span class="dot"></span>صباح مقابل مساء</h2>
          <canvas id="chart-shift"></canvas>
        </div>
      </div>

      <div class="card chart-card" style="margin-bottom:22px;">
        <h2><span class="dot"></span>الإيراد حسب الخدمة</h2>
        <canvas id="chart-service"></canvas>
      </div>

      <div class="card" style="margin-bottom:22px;">
        <div class="settings-toggle" onclick="toggleSettings()">⚙ تعديل الأسعار <span id="settings-arrow">▾</span></div>
        <div class="settings-body" id="settings-body">
          <div class="price-grid" id="price-grid"></div>
          <button class="save-prices-btn" onclick="savePrices()">حفظ الأسعار</button>
        </div>
      </div>

      <div class="card">
        <h2><span class="dot"></span>سجل العمليات</h2>
        <div id="table-wrap"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"><span class="sw"></span><span id="toast-text"></span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script>
const SERVICES = [
  {key:'regular',  name:'نسخة عادية',            unit:'نسخة'},
  {key:'color',    name:'نسخة ملونة',             unit:'نسخة'},
  {key:'idphoto',  name:'تصوير شخصي',             unit:'صورة'},
  {key:'printbw',  name:'طباعة صفحة عادية',        unit:'صفحة'},
  {key:'printcol', name:'طباعة صفحة ملونة',        unit:'صفحة'},
  {key:'project',  name:'إعداد مشروع تخرج',        unit:'مشروع'},
  {key:'binding',  name:'تجليد مشروع/تقرير',       unit:'نسخة'},
];
const DEFAULT_PRICES = {regular:0,color:0,idphoto:0,printbw:0,printcol:0,project:0,binding:0};

let state = {
  entries: [],
  prices: {...DEFAULT_PRICES},
  currentShift: 'صباح',
  qty: {}
};
SERVICES.forEach(s => state.qty[s.key] = 0);

function fmt(n){
  return (Math.round((n||0)*1000)/1000).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3});
}
function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

// ---------------- Storage ----------------
async function loadAll(){
  try{
    const e = await window.storage.get('entries', true);
    state.entries = e && e.value ? JSON.parse(e.value) : [];
  }catch(err){ state.entries = []; }
  try{
    const p = await window.storage.get('prices', true);
    state.prices = p && p.value ? JSON.parse(p.value) : {...DEFAULT_PRICES};
  }catch(err){ state.prices = {...DEFAULT_PRICES}; }
}
async function persistEntries(){
  try{ await window.storage.set('entries', JSON.stringify(state.entries), true); }
  catch(err){ showToast('تعذّر الحفظ، حاول مجدداً'); }
}
async function persistPrices(){
  try{ await window.storage.set('prices', JSON.stringify(state.prices), true); }
  catch(err){ showToast('تعذّر حفظ الأسعار'); }
}

// ---------------- Tabs ----------------
function switchTab(tab){
  document.getElementById('view-entry').style.display = tab==='entry' ? '' : 'none';
  document.getElementById('view-dash').style.display = tab==='dash' ? '' : 'none';
  document.getElementById('tab-entry').classList.toggle('active', tab==='entry');
  document.getElementById('tab-dash').classList.toggle('active', tab==='dash');
  if(tab==='dash') renderDashboard();
}
function setShift(s){
  state.currentShift = s;
  document.getElementById('btn-morning').classList.toggle('active', s==='صباح');
  document.getElementById('btn-evening').classList.toggle('active', s==='مساء');
  updateReceipt();
}

// ---------------- Entry form ----------------
function buildServiceRows(){
  const wrap = document.getElementById('svc-rows');
  wrap.innerHTML = SERVICES.map(s => `
    <div class="svc-row">
      <div class="svc-name"><div class="t">${s.name}</div><div class="u">${s.unit}</div></div>
      <div class="stepper">
        <button type="button" onclick="stepQty('${s.key}',1)">+</button>
        <input type="text" inputmode="numeric" id="qty-${s.key}" value="0" onchange="setQty('${s.key}', this.value)">
        <button type="button" onclick="stepQty('${s.key}',-1)">−</button>
      </div>
      <div class="svc-sub mono" id="sub-${s.key}">0.000</div>
    </div>
  `).join('');
}
function stepQty(key, delta){
  state.qty[key] = Math.max(0, (state.qty[key]||0) + delta);
  document.getElementById('qty-'+key).value = state.qty[key];
  updateReceipt();
}
function setQty(key, val){
  const n = Math.max(0, parseInt(val)||0);
  state.qty[key] = n;
  document.getElementById('qty-'+key).value = n;
  updateReceipt();
}
function computeTotals(){
  let total = 0;
  const lines = SERVICES.map(s => {
    const q = state.qty[s.key]||0;
    const price = state.prices[s.key]||0;
    const sub = q*price;
    total += sub;
    return {...s, q, price, sub};
  });
  const expenses = parseFloat(document.getElementById('f-expenses').value) || 0;
  return {lines, total, expenses, net: total-expenses};
}
function updateReceipt(){
  const {lines, total, expenses, net} = computeTotals();
  lines.forEach(l => {
    const el = document.getElementById('sub-'+l.key);
    if(el) el.textContent = fmt(l.sub);
  });
  const date = document.getElementById('f-date').value || todayStr();
  document.getElementById('r-date').textContent = `${date} · ${state.currentShift}`;
  document.getElementById('r-lines').innerHTML = lines.filter(l=>l.q>0).map(l => `
    <div class="rline"><span class="rl-name">${l.name} × ${l.q}</span><span class="rl-val mono">${fmt(l.sub)}</span></div>
  `).join('') || '<div class="rline"><span class="rl-name" style="color:#B9BEC1;">لا توجد عناصر بعد</span></div>';
  document.getElementById('r-total').textContent = fmt(total);
  document.getElementById('r-net').textContent = fmt(net) + ' د.ل';
}

async function saveEntry(){
  const {lines, total, expenses, net} = computeTotals();
  if(total === 0 && expenses === 0){
    showToast('أدخل كمية واحدة على الأقل قبل الحفظ');
    return;
  }
  const entry = {
    id: Date.now(),
    date: document.getElementById('f-date').value || todayStr(),
    shift: state.currentShift,
    employee: document.getElementById('f-employee').value.trim(),
    qty: {...state.qty},
    revenue: total,
    expenses: expenses,
    net: net
  };
  state.entries.push(entry);
  await persistEntries();

  // print flash animation
  const flash = document.getElementById('print-flash');
  flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
  showToast('تم حفظ العملية بنجاح');

  // reset quantities
  SERVICES.forEach(s => state.qty[s.key] = 0);
  buildServiceRows();
  document.getElementById('f-expenses').value = '0';
  document.getElementById('f-employee').value = entry.employee;
  updateReceipt();
}

function showToast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toast-text').textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=> t.classList.remove('show'), 2600);
}

// ---------------- Settings ----------------
function toggleSettings(){
  const body = document.getElementById('settings-body');
  const open = body.classList.toggle('open');
  document.getElementById('settings-arrow').textContent = open ? '▴' : '▾';
}
function buildPriceGrid(){
  const grid = document.getElementById('price-grid');
  grid.innerHTML = SERVICES.map(s => `
    <div class="price-item">
      <label>${s.name} (لكل ${s.unit})</label>
      <input type="text" inputmode="decimal" id="price-${s.key}" value="${state.prices[s.key]||0}">
    </div>
  `).join('');
}
async function savePrices(){
  SERVICES.forEach(s => {
    const v = parseFloat(document.getElementById('price-'+s.key).value);
    state.prices[s.key] = isNaN(v) ? 0 : v;
  });
  await persistPrices();
  showToast('تم تحديث الأسعار');
  updateReceipt();
  renderDashboard();
}

// ---------------- Dashboard ----------------
let charts = {};
function filteredEntries(){
  const from = document.getElementById('filt-from').value;
  const to = document.getElementById('filt-to').value;
  return state.entries.filter(e => (!from || e.date>=from) && (!to || e.date<=to));
}
function renderDashboard(){
  const entries = filteredEntries();
  const totalRev = entries.reduce((a,e)=>a+e.revenue,0);
  const totalExp = entries.reduce((a,e)=>a+e.expenses,0);
  const net = totalRev - totalExp;
  const count = entries.length;
  const avg = count ? totalRev/count : 0;

  document.getElementById('k-rev').textContent = fmt(totalRev);
  document.getElementById('k-net').textContent = fmt(net);
  document.getElementById('k-cnt').textContent = count;
  document.getElementById('k-avg').textContent = fmt(avg);

  // by day
  const byDay = {};
  entries.forEach(e => { byDay[e.date] = (byDay[e.date]||0) + e.revenue; });
  const days = Object.keys(byDay).sort();

  // by shift
  const byShift = {'صباح':0,'مساء':0};
  entries.forEach(e => { byShift[e.shift] = (byShift[e.shift]||0) + e.revenue; });

  // by service
  const byService = {};
  SERVICES.forEach(s => byService[s.key]=0);
  entries.forEach(e => SERVICES.forEach(s => byService[s.key] += (e.qty[s.key]||0)*(state.prices[s.key]||0)));

  try{
    if(typeof Chart !== 'undefined'){
      Chart.defaults.font.family = "'IBM Plex Sans Arabic', sans-serif";
      Chart.defaults.color = '#4A5259';

      if(charts.line) charts.line.destroy();
      charts.line = new Chart(document.getElementById('chart-line'), {
        type:'line',
        data:{ labels: days, datasets:[{ label:'الإيراد', data: days.map(d=>byDay[d]), borderColor:'#D6006F', backgroundColor:'rgba(214,0,111,.08)', fill:true, tension:.3, pointRadius:3 }]},
        options:{ plugins:{legend:{display:false}}, scales:{ y:{ grid:{color:'#EDEFEC'} }, x:{ grid:{display:false} } } }
      });

      if(charts.shift) charts.shift.destroy();
      charts.shift = new Chart(document.getElementById('chart-shift'), {
        type:'doughnut',
        data:{ labels:['صباح','مساء'], datasets:[{ data:[byShift['صباح'], byShift['مساء']], backgroundColor:['#F2B705','#14181C'] }]},
        options:{ plugins:{legend:{position:'bottom'}} }
      });

      if(charts.service) charts.service.destroy();
      charts.service = new Chart(document.getElementById('chart-service'), {
        type:'bar',
        data:{ labels: SERVICES.map(s=>s.name), datasets:[{ label:'الإيراد', data: SERVICES.map(s=>byService[s.key]), backgroundColor:'#0092BC', borderRadius:4 }]},
        options:{ plugins:{legend:{display:false}}, scales:{ y:{ grid:{color:'#EDEFEC'} }, x:{ grid:{display:false} } } }
      });
    }
  }catch(chartErr){
    console.error('Chart rendering failed:', chartErr);
  }

  // table
  const tw = document.getElementById('table-wrap');
  if(entries.length === 0){
    tw.innerHTML = `<div class="empty-state"><div class="es-mark">✛</div>لا توجد عمليات مسجلة بعد لهذه الفترة</div>`;
    return;
  }
  const rows = [...entries].sort((a,b)=> b.id-a.id).slice(0,40).map(e => `
    <tr>
      <td>${e.date}</td>
      <td>${e.shift}</td>
      <td>${e.employee||'—'}</td>
      <td class="num">${fmt(e.revenue)}</td>
      <td class="num">${fmt(e.expenses)}</td>
      <td class="num">${fmt(e.net)}</td>
    </tr>
  `).join('');
  tw.innerHTML = `
    <table class="log-table">
      <thead><tr><th>التاريخ</th><th>الفترة</th><th>الموظف</th><th>الإيراد</th><th>المصروفات</th><th>الصافي</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ---------------- Init ----------------
async function init(){
  document.getElementById('f-date').value = todayStr();
  buildServiceRows();
  buildPriceGrid();
  await loadAll();
  buildPriceGrid();
  updateReceipt();
  document.getElementById('f-expenses').addEventListener('input', updateReceipt);
}
init();
</script>
